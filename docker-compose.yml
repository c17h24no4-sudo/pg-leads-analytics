services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
      POSTGRES_DB: leads
    ports:
      - "5434:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads"]
      interval: 3s
      retries: 20
